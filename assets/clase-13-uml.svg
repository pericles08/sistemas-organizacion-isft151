<title id="title">Casos de uso del servicio de orientación de correlatividades</title><desc id="desc">Cuatro casos de uso: Obtener orientación, Solicitar revisión, Registrar revisión y Mantener criterios. Actores: Estudiante, Secretaría Académica, Gestión académica y Repositorio normativo.</desc>
