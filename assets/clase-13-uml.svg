<text x="30" y="749" font-size="17" fill="#52616c">Líneas = participación de actores. No representan flujo de datos ni orden de ejecución.</text>
<text x="30" y="778" font-size="17" fill="#52616c">Alcance: orientar y registrar revisión. La autorización formal de inscripción queda fuera del sistema.</text>
